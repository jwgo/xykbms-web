<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XYKBMS 설정</title>
<style>
:root {
  --bg: #f4f4f6; --panel: #ffffff; --line: #e2e2e7; --text: #1c1c1f; --muted: #6b6b75;
  --accent: #2f6fed; --accent-text: #fff; --warn: #e8871e; --err: #d93a3a; --ok: #2e9b57;
  --deck: #131416; --cap-top: #353537; --cap-bot: #222224; --cap-edge: #4c4c4e; --legend: #ededed;
  --fn-blue: #5c9eff; --changed: #ff9e33; --enter-top: #33508c; --enter-bot: #213366;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17171a; --panel: #212125; --line: #34343a; --text: #ececf0; --muted: #9a9aa5; --accent: #4a86ff; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 11px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.danger { color: var(--err); }
button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
select, input[type=text], input[type=number] { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; }
header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0 8px 0 0; }
.status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--ok); } .dot.err { background: var(--err); } .dot.warn { background: var(--warn); }
.spacer { flex: 1; }
.dirty { color: var(--warn); font-size: 13px; }
progress { width: 90px; }
nav { display: flex; gap: 4px; padding: 10px 16px 0; flex-wrap: wrap; max-width: 1180px; margin: 0 auto; }
nav button { border-radius: 7px 7px 0 0; border-bottom: none; }
nav button.on { background: var(--panel); color: var(--text); border-color: var(--line); font-weight: 600; }
main { max-width: 1180px; margin: 0 auto; padding: 0 16px 40px; }
.page { background: var(--panel); border: 1px solid var(--line); border-radius: 0 10px 10px 10px; padding: 18px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
.card h3 { margin: 0 0 10px; font-size: 15px; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0; }
.grid2 { display: grid; grid-template-columns: 300px 1fr; gap: 14px; align-items: start; }
@media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
label.toggle { display: flex; align-items: center; gap: 8px; margin: 7px 0; cursor: pointer; }
label.toggle input { width: 16px; height: 16px; }
.slider { display: grid; grid-template-columns: 130px 1fr 44px; align-items: center; gap: 10px; margin: 8px 0; }
.toast { position: fixed; right: 16px; bottom: 16px; max-width: 520px; padding: 10px 14px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0,0,0,.18); z-index: 20; }
.toast.err { border-color: var(--err); color: var(--err); }
.banner { border: 1px solid var(--err); color: var(--err); border-radius: 10px; padding: 14px 16px; margin: 14px 0; background: var(--panel); }
.banner.info { border-color: var(--line); color: var(--text); }
table.kv { border-collapse: collapse; width: 100%; } table.kv td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.kv td:first-child { color: var(--muted); width: 170px; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); max-width: 560px; width: calc(100% - 32px); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog ul { max-height: 300px; overflow: auto; padding-left: 20px; }

/* keyboard */
.kbd-wrap { width: 100%; }
.kbd { position: relative; background: var(--deck); border-radius: calc(var(--u) * .35); border: 1px solid #383838; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.cap { position: absolute; border-radius: calc(var(--u) * .09); background: linear-gradient(var(--cap-top), var(--cap-bot)); border-top: 1px solid var(--cap-edge); box-shadow: 0 calc(var(--u) * .035) 0 #000; color: var(--legend); padding: calc(var(--u) * .05) calc(var(--u) * .08); overflow: hidden; cursor: pointer; user-select: none; }
.cap.bezel { border-radius: calc(var(--u) * .3); }
.cap.enter { background: linear-gradient(var(--enter-top), var(--enter-bot)); }
.cap.sel { outline: 2.2px solid var(--accent); box-shadow: 0 0 10px var(--accent); }
.cap.locked { cursor: not-allowed; }
.cap.dim .lg { opacity: .3; }
.cap .main { font-size: calc(var(--u) * .24); font-weight: 500; line-height: 1.1; white-space: nowrap; }
.cap.short .main { font-size: calc(var(--u) * .19); }
.cap .sub { font-size: calc(var(--u) * .13); color: #9a9a9a; white-space: nowrap; }
.cap .fnl { position: absolute; right: calc(var(--u) * .07); bottom: calc(var(--u) * .04); font-size: calc(var(--u) * .14); color: var(--fn-blue); }
.cap .orig { font-size: calc(var(--u) * .12); color: #8a8a8a; white-space: nowrap; }
.cap.changed .main { color: var(--changed); }
.cap.fnval .main { color: var(--fn-blue); }
.cap.fixed { cursor: default; }
.cap.fixed.fnmode { outline: 2px solid var(--fn-blue); }
.nub { position: absolute; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ff5a5a, #db1a1f); box-shadow: 0 1px 2px #000; pointer-events: none; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 10px 0; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.palette h4 { margin: 12px 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
.palette .keys { display: flex; flex-wrap: wrap; gap: 5px; }
.palette .keys button { min-width: 42px; padding: 4px 7px; background: #2a2a2d; color: #eee; border-color: #444; }
.palette .keys button.cur { outline: 2px solid var(--accent); }
.palette .keys button small { display: block; font-size: 10px; color: #9cf; }
.selbig { font-size: 26px; font-weight: 600; }
.macro .summary { font-size: 22px; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>XYKBMS</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">연결 중…</span></div>
  <div class="spacer"></div>
  <span id="busy"></span>
  <span class="dirty" id="dirty"></span>
  <button id="btnReload" title="키보드에서 다시 읽기">다시 읽기</button>
  <button id="btnDiscard">되돌리기</button>
  <button id="btnApply" class="primary">적용</button>
</header>
<nav id="tabs"></nav>
<main><div id="banner"></div><div class="page" id="page"></div></main>
<dialog id="confirm">
  <h3>키보드에 적용할까요?</h3>
  <ul id="confirmList"></ul>
  <p class="muted small">쓰기 전에 지금 설정을 자동으로 백업하고, 쓴 뒤 다시 읽어 같은지 확인해요. 쓰는 동안 보드가 재시작돼서 키보드가 잠깐 끊겨요.</p>
  <div class="row" style="justify-content:flex-end"><button id="cancelApply">취소</button><button class="primary" id="okApply">적용</button></div>
</dialog>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hex = (n, w) => n.toString(16).toUpperCase().padStart(w, "0");

let META = null, S = null, lastKey = "", lastEvent = null;
const ui = { tab: location.hash.slice(1).split("-")[0] || localGet("tab") || "keymap", layer: location.hash.endsWith("-fn") ? "fn" : "base", sel: null };
const TABS = [["keymap", "키 배열"], ["macro", "매크로"], ["keys", "키 옵션"], ["pointing", "트랙포인트"], ["device", "보드 정보"], ["backup", "백업"]];

function localGet(k) { try { return localStorage.getItem("xykbms." + k); } catch { return null; } }
function localSet(k, v) { try { localStorage.setItem("xykbms." + k, v); } catch {} }

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}
async function post(path, body = {}) {
  try {
    const res = await api(path, body);
    if (res.error) toast(res.error, true); else if (res.message) toast(res.message);
    if (res.state) setState(res.state);
  } catch (e) { toast("서버와 연결이 끊겼어요: " + e.message, true); }
}
const edit = (op, args = {}) => post("/api/edit", { op, ...args });

let toastTimer;
function toast(text, err = false) {
  const t = $("#toast"); t.textContent = text; t.className = "toast" + (err ? " err" : ""); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), err ? 8000 : 3500);
}

function setState(s) {
  S = s;
  if (s.event && lastEvent !== null && s.event.id !== lastEvent) toast(s.event.text, s.event.error);
  lastEvent = s.event ? s.event.id : 0;
  renderHeader();
  const { progress, event, ...rest } = s;
  const key = JSON.stringify(rest) + ui.tab + ui.layer + ui.sel;
  if (key !== lastKey) { lastKey = key; render(); }
}

async function poll() {
  try { setState(await api("/api/state")); } catch { $("#statusText").textContent = "서버에 연결할 수 없어요 (터미널에서 서버가 켜져 있나요?)"; $("#dot").className = "dot err"; }
  setTimeout(poll, S && S.busy ? 300 : 1000);
}

function renderHeader() {
  const s = S, connected = s.link === "connected";
  $("#dot").className = "dot " + (connected ? "ok" : s.link === "failed" ? "err" : "warn");
  $("#statusText").textContent = connected ? `${s.mock ? "목업 보드 · " : ""}${s.board} · 펌웨어 ${s.version}` : s.link === "failed" ? "연결 안 됨" : "연결 중…";
  $("#busy").innerHTML = s.busy ? (s.progress > 0 ? `<progress max="1" value="${s.progress}"></progress>` : `<span class="muted small">작업 중…</span>`) : "";
  $("#dirty").textContent = !s.busy && s.dirty ? `● 변경 ${s.changes.length}개` : "";
  $("#btnReload").disabled = !connected || s.busy;
  $("#btnDiscard").disabled = !s.dirty || s.busy;
  $("#btnApply").disabled = !s.dirty || s.busy || !connected;
}

function render() {
  $("#tabs").innerHTML = TABS.map(([id, t]) => `<button data-tab="${id}" class="${ui.tab === id ? "on" : ""}">${t}</button>`).join("");
  const s = S;
  let banner = "";
  if (s.link === "failed") banner = `<div class="banner"><b>키보드에 연결하지 못했어요</b><div>${esc(s.linkError)}</div><div class="row"><button data-act="connect" class="primary">다시 시도</button></div></div>`;
  else if (s.link === "searching" && !s.base) banner = `<div class="banner info">키보드를 찾는 중…</div>`;
  $("#banner").innerHTML = banner;
  if (!s.base) { $("#page").innerHTML = `<p class="muted">키보드가 연결되면 설정이 여기에 나와요.</p>`; return; }
  const pages = { keymap: pageKeymap, macro: pageMacro, keys: pageKeys, pointing: pagePointing, device: pageDevice, backup: pageBackup };
  const focused = document.activeElement && document.activeElement.id;
  $("#page").innerHTML = pages[ui.tab]();
  if (ui.tab === "keymap") layoutKeyboard();
  if (focused && document.getElementById(focused)) document.getElementById(focused).focus();
}

/* ---------------- keymap ---------------- */
function capInfo(cap) {
  const fnMode = ui.layer === "fn", i = cap.index;
  const swapped = (S.header.flagsB & 4) !== 0;
  const locked = swapped && i === 0x1E;
  if (i === null) return { fixed: true, swapped, fnMode };
  const base = S.base[i].w;
  const fnW = S.fn[i] ? S.fn[i].w : null;
  const devFn = S.devFn[i] ?? null;
  const word = fnMode ? (fnW ?? base) : base;
  const stock = fnMode ? (devFn ?? base) : META.stock[i].w;
  const changed = fnMode ? fnW !== devFn : word !== stock;
  const lab = fnMode && fnW !== null ? S.fn[i] : S.base[i];
  return { fnMode, i, base, fnW, devFn, word, stock, changed, lab, locked, swapped,
           dim: fnMode && fnW === null, editable: (cap.kind === "key" || cap.kind === "bezel") && !locked };
}

function capHTML(cap) {
  const c = capInfo(cap);
  const cls = ["cap", cap.kind];
  if (cap.enter) cls.push("enter");
  if (cap.h < 0.8) cls.push("short");
  let inner = "";
  if (c.fixed) {
    cls.push("fixed"); if (c.fnMode) cls.push("fnmode");
    inner = `<div class="main" style="color:${c.swapped ? "var(--changed)" : "var(--fn-blue)"}">${c.swapped ? "Ctrl" : "Fn"} 🔒</div>`;
    return `<div class="${cls.join(" ")}" style="${pos(cap)}" title="Fn은 전용 핀이라 바꿀 수 없어요"><div class="lg">${inner}</div></div>`;
  }
  if (c.locked) { cls.push("locked"); inner = `<div class="main" style="color:var(--changed)">Fn 🔒</div>`; }
  else if (c.word === 0xFFFF && cap.label) inner = `<div class="main" style="color:#bbb;font-size:calc(var(--u)*.15)">${esc(cap.label)}</div><div class="sub">비어 있음</div>`;
  else {
    inner = `<div class="main">${esc(c.lab.main)}</div>`;
    if (c.lab.sub) inner += `<div class="sub">${esc(c.lab.sub)}</div>`;
    else if (c.changed && !c.fnMode && cap.h >= 0.8) inner += `<div class="orig">원래 ${esc(META.stock[c.i].main)}</div>`;
    if (!c.fnMode && cap.fn) inner += `<span class="fnl">${esc(cap.fn)}</span>`;
  }
  if (c.changed) cls.push("changed");
  if (c.fnMode && c.fnW !== null) cls.push("fnval");
  if (c.dim) cls.push("dim");
  if (ui.sel === c.i) cls.push("sel");
  const title = c.locked ? "Fn↔Ctrl 교체가 켜져 있어 이 키는 Fn으로 동작해요" : `스캔 0x${hex(c.i, 2)}`;
  return `<div class="${cls.join(" ")}" style="${pos(cap)}" ${c.editable ? `data-key="${c.i}"` : ""} title="${title}"><div class="lg">${inner}</div></div>`;
}
const PAD = 0.35;
const pos = (c) => `left:calc(var(--u)*${c.x + PAD});top:calc(var(--u)*${c.y + PAD});width:calc(var(--u)*${c.w - 0.07});height:calc(var(--u)*${c.h - 0.07})`;

function layoutKeyboard() {
  const wrap = $(".kbd-wrap"); if (!wrap) return;
  const u = wrap.clientWidth / (META.width + PAD * 2);
  const k = $(".kbd");
  k.style.setProperty("--u", u + "px");
  k.style.height = (META.height + PAD * 2) * u + "px";
}
window.addEventListener("resize", layoutKeyboard);

function keyName(i) { return META.extraButtons[i] ? META.extraButtons[i].replace(" 버튼", "") : META.stock[i].main; }

function pageKeymap() {
  if (!S.hasX220Pins) return `<div class="card"><h3>키 배열 에디터를 쓸 수 없어요</h3><p class="muted">이 보드의 핀 배치가 X220 기본형과 달라요. 잘못된 키에 값을 쓰지 않으려고 막아 뒀어요.</p></div>`;
  const fn = ui.layer === "fn";
  const caps = META.caps.map(capHTML).join("");
  const nub = `<div class="nub" style="left:calc(var(--u)*${META.nub[0] + PAD - 0.17});top:calc(var(--u)*${META.nub[1] + PAD - 0.17});width:calc(var(--u)*.34);height:calc(var(--u)*.34)"></div>`;
  return `
  <div class="row">
    <button data-layer="base" class="${fn ? "" : "on"}">기본 레이어</button><button data-layer="fn" class="${fn ? "on" : ""}">Fn 레이어</button>
    ${fn ? `<span style="color:var(--fn-blue)">Fn을 누른 채 누르면 나오는 기능 · ${S.fnUsed}/${META.fnSlots}칸</span>` : ""}
    <div class="spacer"></div>
    <button data-edit="macbook_fn_row" title="Fn+F1~F12: 밝기−/+, Mission Control, Spotlight, 받아쓰기, 방해금지, 이전·재생·다음, 음소거, 볼륨−/+">맥북 Fn 배열 (F1~F12)</button>
  </div>
  <div class="kbd-wrap"><div class="kbd">${caps}${nub}</div></div>
  <div class="legend"><span><i style="background:var(--changed)"></i>바꾼 키</span><span><i style="background:var(--fn-blue)"></i>파란 글씨 = 키캡에 인쇄된 Fn 기능</span><span><i style="background:#888"></i>Mic·ThinkVantage = 공장 설정엔 비어 있던 버튼</span></div>
  <div class="grid2">${selectedPanel()}${palette()}</div>`;
}

function selectedPanel() {
  const i = ui.sel;
  let body;
  if (i === null) body = `<p class="muted">키보드 그림에서 키를 클릭하세요.</p>`;
  else {
    const fnMode = ui.layer === "fn";
    const c = capInfo({ index: i, kind: "key" });
    if (fnMode) {
      body = `<div style="color:var(--fn-blue)" class="small">Fn + ${esc(keyName(i))}</div>
        <div class="selbig">${c.fnW === null ? "Fn 조합 없음" : "→ " + esc(S.fn[i].main)}</div>
        <div class="muted small">키보드에 있는 값: ${c.devFn === null ? "없음" : esc(META.stock[i] && S.devFn[i] !== undefined ? labelOf(S.devFn[i]) : "")}</div>`;
    } else {
      body = `<div class="selbig" style="color:${c.word === c.stock ? "inherit" : "var(--changed)"}">${esc(S.base[i].main)}</div>
        ${S.base[i].sub ? `<div class="muted small">${esc(S.base[i].sub)}</div>` : ""}
        <div class="muted small">${esc(META.extraButtons[i] || "원래 키")}: ${c.stock === 0xFFFF ? "공장 설정: 비어 있음" : esc(META.stock[i].main)}</div>`;
    }
    body += `<div class="muted small" style="font-family:ui-monospace,monospace">스캔 0x${hex(i, 2)} · 값 0x${hex(fnMode ? (c.fnW ?? 0xFFFF) : c.word, 4)}</div>
      <div class="row">
        <button data-edit="reset_key" data-idx="${i}" ${c.word === c.stock && (!fnMode || c.fnW === c.devFn) ? "disabled" : ""}>${fnMode ? "되돌리기" : "기본값으로"}</button>
        ${fnMode ? `<button data-edit="clear_fn" data-scan="${i}" ${c.fnW === null ? "disabled" : ""}>Fn 조합 지우기</button>`
                 : `<button data-assign="65535" ${c.word === 0xFFFF ? "disabled" : ""}>비활성화</button>`}
      </div>`;
  }
  return `<div class="card"><h3>선택한 키</h3>${body}
    <hr style="border:none;border-top:1px solid var(--line);margin:12px 0">
    <div class="row"><button data-edit="mac_preset">맥 배열 프리셋</button><button data-edit="reset_all_keys">모든 키를 공장 배열로</button></div>
    <p class="muted small">바꾼 뒤 오른쪽 위 '적용'을 눌러야 키보드에 써져요. 쓰기 전에 자동으로 백업해요.</p></div>`;
}
function labelOf(w) {
  for (const g of META.groups) for (const x of g.words) if (x.w === w) return x.main;
  return hex(w, 4);
}

function palette() {
  const i = ui.sel;
  const cur = i === null ? null : ui.layer === "fn" ? (S.fn[i] ? S.fn[i].w : null) : S.base[i].w;
  const groups = META.groups.map((g) => `<h4>${esc(g.title)}${g.experimental ? " · 실험적 (보드에서 확인 안 됨)" : ""}</h4><div class="keys">${
    g.words.map((x) => `<button data-assign="${x.w}" ${i === null ? "disabled" : ""} class="${cur === x.w ? "cur" : ""}">${esc(x.main)}${x.sub ? `<small>${esc(x.sub)}</small>` : ""}</button>`).join("")}</div>`).join("");
  return `<div class="card palette"><h3>새 키 고르기</h3>${groups}<p class="muted small">매크로 내용은 '매크로' 탭에서 만들어요.</p></div>`;
}

/* ---------------- macro ---------------- */
const MOD_BITS = [["⌃ Ctrl", 0x01], ["⇧ Shift", 0x02], ["⌥ Opt", 0x04], ["⌘ Cmd", 0x08]];
function pageMacro() {
  const cards = S.macros.map((m, n) => {
    const mods = m.mods, key = m.key;
    const presetOpts = META.presets.map((p, j) => `<option value="${j}">${esc(p.title)}</option>`).join("");
    const keyOpts = `<option value="0">키 없음</option>` + META.macroKeys.map((k) => `<option value="${k.w}" ${k.w === key ? "selected" : ""}>${esc(k.main)}</option>`).join("");
    return `<div class="card macro"><h3>매크로 ${n + 1}</h3>
      <div class="row"><span class="summary">${esc(m.summary)}</span><div class="spacer"></div>
        <select data-preset="${n}"><option value="">Mac 단축키 프리셋…</option>${presetOpts}</select></div>
      ${m.simple ? "" : `<p class="muted small">공장에서 넣어 둔 여러 줄 매크로예요. 아래에서 바꾸면 한 줄 단축키로 바뀌어요.</p>`}
      <div class="row">${MOD_BITS.map(([t, b]) => `<button data-macro="${n}" data-mods="${mods ^ b}" data-key="${key}" class="${mods & b ? "on" : ""}">${t}</button>`).join("")}
        <span class="muted">+</span><select data-macrokey="${n}" data-mods="${mods}">${keyOpts}</select></div>
      <div class="row"><span class="muted">실행 키</span><span style="color:${m.triggers.length ? "inherit" : "var(--warn)"}">${m.triggers.length ? esc(m.triggers.join(", ")) : "없음. 아래 버튼이나 키 배열의 '매크로' 그룹에서 지정하세요"}</span></div>
      <div class="row"><button data-edit="bind_macro" data-n="${n}" data-idx="7">ThinkVantage에 지정</button><button data-edit="bind_macro" data-n="${n}" data-idx="103">마이크 버튼에 지정</button>
        ${m.hasTrigger ? `<button data-edit="clear_macro_trigger" data-n="${n}">직접 트리거 해제</button>` : ""}<div class="spacer"></div>
        <button class="danger" data-macro="${n}" data-mods="0" data-key="0" ${m.empty ? "disabled" : ""}>지우기</button></div></div>`;
  }).join("");
  return `<p class="muted">버튼 하나로 단축키를 보내요. 키보드 칩이 직접 실행해서 컴퓨터에는 일반 키 입력으로만 보여요. 연속 입력·반복 기능은 없어요.</p>${cards}`;
}

/* ---------------- options ---------------- */
function toggle(title, checked, attrs, note = "", disabled = false) {
  return `<label class="toggle"><input type="checkbox" ${checked ? "checked" : ""} ${disabled ? "disabled" : ""} ${attrs}><span>${esc(title)}${note ? `<br><span class="muted small">${esc(note)}</span>` : ""}</span></label>`;
}
const flagA = (bit) => (S.header.flagsA & bit) !== 0, flagB = (bit) => (S.header.flagsB & bit) !== 0;
function flagToggle(group, id, note = "") {
  const f = (group === "a" ? META.flagsA : META.flagsB).find((x) => x.id === id);
  const on = group === "a" ? flagA(f.bit) : flagB(f.bit);
  return toggle(f.title, on, `data-flag="${group}" data-bit="${f.bit}"`, note);
}

function pageKeys() {
  const caps = S.caps;
  return `<div class="card"><h3>맥 배열</h3>
    ${toggle("Alt ↔ Win 교체", S.altWin === true, `data-bool="set_alt_win"`, S.altWin === null ? "키맵이 기본형과 달라서 바꿀 수 없어요" : "Win 자리 → Option(⌥), Alt 자리 → Command(⌘)", S.altWin === null)}
    ${toggle("오른쪽 Alt → Command", S.ralt === true, `data-bool="set_ralt_cmd"`, S.ralt === null ? "오른쪽 Alt가 다른 값으로 지정돼 있어요 (키 배열에서 바꾸세요)" : "", S.ralt === null)}
    ${caps.swapFnLCtrl ? flagToggle("b", "swapFnLCtrl", "켜면 왼쪽 아래 Fn 키가 Ctrl, Ctrl 키가 Fn으로 동작해요") : ""}
  </div>
  <div class="card"><h3>수정키</h3>${flagToggle("a", "disableWin", "게임할 때 실수로 눌리는 것 방지")}</div>`;
}

function slider(title, name, v, min, max, step = 1) {
  return `<div class="slider"><span>${title}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${v}" data-field="${name}" oninput="this.nextElementSibling.textContent=this.value"><b>${v}</b></div>`;
}
function pagePointing() {
  const c = S.caps, h = S.header;
  let out = `<div class="card"><h3>속도</h3>
    ${c.moveSpeed ? slider("이동 속도", "moveSpeed", h.moveSpeed, 80, 255) : ""}
    ${c.scrollSpeed ? slider("스크롤 속도", "scrollSpeed", h.scrollSpeed, 1, 15) : ""}</div>
  <div class="card"><h3>버튼과 방향</h3>
    ${c.tpMiddleScroll ? flagToggle("a", "tpMiddleScroll") : ""}
    ${c.tpDoubleMiddleBackspace ? flagToggle("a", "tpDoubleMiddleBackspace") : ""}
    ${c.middleBackspace ? flagToggle("a", "middleBackspace") : ""}
    ${c.tpInvertXY ? flagToggle("a", "tpInvertXY") : ""}
    ${c.tpOnAtPowerUp ? flagToggle("a", "tpOnAtPowerUp") : ""}</div>`;
  if (!S.wired) {
    out += `<div class="card"><h3>절전</h3>
      ${c.autoOff ? `<div class="row"><span style="width:180px">키보드 자동 꺼짐(분)</span><input type="number" id="f-autoOff" min="0" max="65535" step="5" value="${h.autoOff}" data-numfield="autoOff"></div>` : ""}
      ${c.tpAutoOff ? `<div class="row"><span style="width:180px">트랙포인트 자동 꺼짐(분)</span><input type="number" id="f-tpAutoOff" min="0" max="65535" step="5" value="${h.tpAutoOff}" data-numfield="tpAutoOff"></div>` : ""}
      ${c.lowPowerKeepLED ? flagToggle("a", "lowPowerKeepLED") : ""}${c.usbLowPower ? flagToggle("a", "usbLowPower") : ""}</div>
      <div class="card"><h3>무선</h3>
      ${c.btName ? `<div class="row"><span style="width:180px">블루투스 이름</span><input type="text" id="f-btName" value="${esc(h.btName)}" maxlength="14" data-textfield="btName"></div>` : ""}
      ${c.rfMode ? `<div class="row"><span style="width:180px">연결 방식</span><select data-selfield="rfMode">${Object.entries(META.rfModes).map(([k, t]) => `<option value="${k}" ${+k === h.rfMode ? "selected" : ""}>${t}</option>`).join("")}</select></div>` : ""}
      ${c.rfChannel ? `<div class="row"><span style="width:180px">채널</span><select data-selfield="rfChannel">${[0, 1, 2, 3].map((k) => `<option ${k === h.rfChannel ? "selected" : ""}>${k}</option>`).join("")}</select></div>` : ""}
      ${c.btPasskey ? flagToggle("b", "btPasskey") : ""}</div>`;
  }
  if (c.backlight) out += `<div class="card"><h3>백라이트</h3>
    <div class="slider"><span>밝기</span><input type="range" min="0" max="100" value="0" data-backlight oninput="this.nextElementSibling.textContent=this.value"><b>0</b></div>
    <p class="muted small">설정에 저장되지 않는 즉시 명령이에요. 키보드에 백라이트 LED가 있어야 보여요.</p></div>`;
  return out;
}

function pageDevice() {
  const rows = [["펌웨어", S.version], ["전압", S.batteryMV ? (S.batteryMV / 1000).toFixed(2) + " V" : "—"], ...S.hardware];
  return `<div class="card"><h3>보드 정보</h3><table class="kv">${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table>
    <p class="muted small">보드 설정에서 읽은 값이에요. 읽기 전용이에요.</p></div>`;
}

function pageBackup() {
  const list = S.backups.length ? `<table class="kv">${S.backups.map((b) => `<tr><td style="width:auto;font-family:ui-monospace,monospace">${esc(b)}</td><td style="width:120px;text-align:right"><button data-edit="load_backup" data-name="${esc(b)}">값 불러오기</button></td></tr>`).join("")}</table>` : `<p class="muted">백업이 없어요.</p>`;
  return `<div class="card"><h3>백업</h3>
    <div class="row"><button data-edit="backup_now">지금 백업</button><span class="muted small">폴더: ${esc(S.backupDir)}</span></div>
    <p class="muted small">'값 불러오기'는 백업의 편집 가능한 항목(키 배열, Fn, 매크로, 설정값)만 화면에 불러와요. 적용을 눌러야 키보드에 써져요.</p>${list}</div>`;
}

/* ---------------- events ---------------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, .cap[data-key]");
  if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.tab) { ui.tab = d.tab; localSet("tab", d.tab); lastKey = ""; render(); return; }
  if (d.layer) { ui.layer = d.layer; lastKey = ""; render(); return; }
  if (d.key !== undefined && t.classList.contains("cap")) { ui.sel = +d.key; lastKey = ""; render(); return; }
  if (d.act === "connect") return post("/api/connect");
  if (d.assign !== undefined) {
    const w = +d.assign;
    if (ui.sel === null) return;
    return ui.layer === "fn" ? edit("set_fn", { scan: ui.sel, word: w }) : edit("set_key", { idx: ui.sel, word: w });
  }
  if (d.macro !== undefined) return edit("set_macro", { n: +d.macro, mods: +d.mods, key: +d.key });
  if (d.edit) {
    const a = {};
    if (d.idx !== undefined) a.idx = +d.idx;
    if (d.scan !== undefined) a.scan = +d.scan;
    if (d.n !== undefined) a.n = +d.n;
    if (d.name !== undefined) a.name = d.name;
    if (d.edit === "reset_key") a.layer = ui.layer;
    if (d.edit === "macbook_fn_row") ui.layer = "fn";
    return edit(d.edit, a);
  }
});
document.addEventListener("change", (e) => {
  const t = e.target, d = t.dataset;
  if (d.flag) return edit("set_flag", { group: d.flag, bit: +d.bit, on: t.checked });
  if (d.bool) return edit(d.bool, { on: t.checked });
  if (d.field) return edit("set_field", { name: d.field, value: +t.value });
  if (d.numfield) return edit("set_field", { name: d.numfield, value: +t.value });
  if (d.selfield) return edit("set_field", { name: d.selfield, value: +t.value });
  if (d.textfield) return edit("set_field", { name: d.textfield, value: t.value });
  if (d.backlight !== undefined) return post("/api/backlight", { percent: +t.value });
  if (d.preset) { if (t.value === "") return; const p = META.presets[+t.value]; return edit("set_macro", { n: +d.preset, mods: p.mods, key: p.key }); }
  if (d.macrokey) return edit("set_macro", { n: +d.macrokey, mods: +d.mods, key: +t.value });
});
$("#btnReload").onclick = () => post("/api/reload");
$("#btnDiscard").onclick = () => edit("discard");
$("#btnApply").onclick = () => {
  $("#confirmList").innerHTML = S.changes.map((c) => `<li>${esc(c)}</li>`).join("");
  $("#confirm").showModal();
};
$("#cancelApply").onclick = () => $("#confirm").close();
$("#okApply").onclick = () => { $("#confirm").close(); post("/api/apply"); };
document.addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && !$("#btnApply").disabled) $("#btnApply").click(); });

(async () => {
  try { META = await api("/api/meta"); } catch (e) { $("#statusText").textContent = "서버에 연결할 수 없어요"; return; }
  poll();
})();
</script>
</body>
</html>
